name: CI

on:
    push:
        branches: [dev, master]
    pull_request:
        branches: [dev, master]

env:
    CARGO_TERM_COLOR: always

jobs:
    rust:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Install Tauri Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libwebkit2gtk-4.1-dev \
                      libappindicator3-dev \
                      libfuse2 \
                      librsvg2-dev \
                      patchelf \
                      xdg-utils

            - name: Install nightly toolchain
              run: rustup toolchain install nightly --component clippy --component rustfmt

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 26
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci

            - name: Cache cargo
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

            - name: Check formatting
              run: cargo fmt --check

            - name: Build
              run: cargo build --workspace

            - name: Run tests
              run: cargo test --workspace --all-features

            - name: Clippy
              run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 26
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              working-directory: frontend
              run: npm ci

            - name: Build
              working-directory: frontend
              run: npm run build

    desktop:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Install Tauri Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libwebkit2gtk-4.1-dev \
                      libappindicator3-dev \
                      libfuse2 \
                      librsvg2-dev \
                      patchelf \
                      xdg-utils

            - name: Install nightly toolchain
              run: rustup toolchain install nightly

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 26
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci

            - name: Cache cargo
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-desktop-cargo-${{ hashFiles('Cargo.lock') }}

            - name: Build desktop app crate
              run: cargo build -p gmap-to-umap-desktop
